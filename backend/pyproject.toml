[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "self-healing-rag"
version = "0.1.0"
description = "Production-grade Self-Healing RAG Pipeline with LangGraph"
requires-python = ">=3.11"

dependencies = [
    # Web Framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1.0",
    "slowapi>=0.1.9",

    # LangChain / LangGraph — no strict pins, let pip resolve
    "langchain>=0.2.5",
    "langchain-core>=0.2.22",
    "langchain-community>=0.2.5",
    "langchain-openai>=0.1.8",
    "langchain-anthropic>=0.1.15",
    "langchain-groq>=0.1.6",
    "langgraph>=0.1.19",
    "langsmith>=0.1.77",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "pgvector>=0.2.5",

    # Redis
    "redis[asyncio]>=5.0.4",

    # Embeddings / ML
    "openai>=1.30.1",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.4",

    # Document Loaders
    "pypdf>=4.2.0",
    "python-docx>=1.1.2",
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.0",
    "aiofiles>=23.2.1",

    # Evaluation
    "ragas>=0.1.10",
    "datasets>=2.19.2",

    # Observability
    "prometheus-client>=0.20.0",

    # Config / Utils
    "pydantic>=2.7.4,<3.0.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "tenacity>=8.3.0",
    "structlog>=24.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "black>=24.4.2",
    "ruff>=0.4.7",
    "isort>=5.13.2",
    "pre-commit>=3.7.1",
    "locust>=2.29.1",
]
dashboard = [
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "--cov=app --cov-report=term-missing --cov-report=html"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "dashboard*"]